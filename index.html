<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청소 스케줄 생성기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f6fa; font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; padding: 20px 16px; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .header { display: flex; align-items: center; gap: 10px; }
  .header h1 { font-size: 17px; font-weight: 700; color: #1a1a2e; }
  .header p { font-size: 12px; color: #999; margin-top: 3px; }
  .drop-zone { border: 2px dashed #d0d5e8; border-radius: 14px; padding: 30px 20px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
  .drop-zone.has-image { border-color: #4f7cff; border-style: solid; }
  .drop-zone:hover { border-color: #4f7cff; }
  .drop-zone img { max-width: 100%; max-height: 260px; border-radius: 8px; object-fit: contain; }
  .drop-icon { font-size: 36px; margin-bottom: 8px; }
  .drop-text { font-weight: 600; color: #333; font-size: 15px; }
  .drop-sub { font-size: 12px; color: #aaa; margin-top: 5px; }
  input[type=file] { display: none; }
  .btn-main { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #4f7cff; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
  .btn-main:disabled { background: #cdd4e8; cursor: not-allowed; }
  .result-box { background: #f8f9ff; border-radius: 10px; padding: 16px; font-size: 14px; line-height: 1.9; color: #2c3e50; word-break: break-all; white-space: pre-wrap; }
  .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .result-title { font-weight: 700; font-size: 15px; color: #1a1a2e; }
  .btn-copy { padding: 6px 14px; border-radius: 8px; border: none; background: #4f7cff; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-copy.copied { background: #27ae60; }
  .error { background: #fff0f0; border: 1px solid #ffb3b3; border-radius: 12px; padding: 14px; font-size: 13px; color: #c0392b; white-space: pre-wrap; }
  .guide { background: #fffbea; border-radius: 12px; padding: 14px; font-size: 12px; color: #7a6b2e; line-height: 1.8; }
  .loading { text-align: center; padding: 10px; color: #4f7cff; font-size: 14px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #e0e7ff; border-top-color: #4f7cff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .key-row { display: flex; gap: 8px; align-items: center; }
  .key-input { flex: 1; padding: 10px 12px; border: 1.5px solid #d0d5e8; border-radius: 10px; font-size: 13px; color: #333; outline: none; }
  .key-input:focus { border-color: #4f7cff; }
  .key-input.saved { border-color: #27ae60; background: #f0fff4; }
  .btn-save { padding: 10px 16px; border-radius: 10px; border: none; background: #4f7cff; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-save.saved { background: #27ae60; }
  .key-status { font-size: 12px; margin-top: 6px; color: #27ae60; display: none; }
  .toggle-key { font-size: 11px; color: #aaa; cursor: pointer; text-decoration: underline; margin-top: 4px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 헤더 -->
  <div class="card">
    <div class="header">
      <span style="font-size:26px">🧹</span>
      <div>
        <h1>청소 스케줄 문자 생성기</h1>
        <p>PMS 화면 캡처 → 청소 이모님 문자 자동 생성</p>
      </div>
    </div>
  </div>

  <!-- 이미지 업로드 -->
  <div class="card">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
      ondrop="handleDrop(event)" ondragover="event.preventDefault()">
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">
      <div id="placeholder">
        <div class="drop-icon">📸</div>
        <div class="drop-text">PMS 화면 캡처 이미지 업로드</div>
        <div class="drop-sub">클릭하거나 이미지를 드래그하세요</div>
        <div class="drop-sub">객실현황(이달) 화면 권장</div>
      </div>
      <img id="preview" style="display:none" alt="preview">
    </div>
  </div>

  <!-- 버튼 -->
  <button class="btn-main" id="analyzeBtn" onclick="analyze()" disabled>✨ 문자 생성하기</button>

  <!-- 로딩 -->
  <div class="loading" id="loading" style="display:none;margin-top:12px">
    <span class="spinner"></span> 이미지 분석 중... 잠시만 기다려주세요
  </div>

  <!-- 에러 -->
  <div class="error" id="errorBox" style="display:none;margin-top:12px"></div>

  <!-- 결과 -->
  <div class="card" id="resultCard" style="display:none;margin-top:14px">
    <div class="result-header">
      <span class="result-title">📱 생성된 문자</span>
      <button class="btn-copy" id="copyBtn" onclick="copyResult()">📋 복사</button>
    </div>
    <div class="result-box" id="resultBox"></div>
  </div>

  <!-- API 키 (하단 접기/펼치기) -->
  <div class="card" id="keyCard" style="margin-top:14px">
    <div onclick="toggleKeyPanel()" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="keyDot" style="width:10px;height:10px;border-radius:50%;background:#ccc;display:inline-block;"></span>
        <span style="font-size:13px;font-weight:700;color:#333;">🔑 API 키 설정</span>
      </div>
      <span id="keyArrow" style="font-size:12px;color:#aaa;">▼ 펼치기</span>
    </div>
    <div id="keyPanel" style="display:none;margin-top:12px;">
      <div class="key-row">
        <input class="key-input" type="password" id="keyInput" placeholder="sk-ant-api03-..." />
        <button class="btn-save" id="saveBtn" onclick="saveKey()">저장</button>
      </div>
      <div class="key-status" id="keyStatus">✅ API 키가 저장되었습니다</div>
      <span class="toggle-key" onclick="toggleKeyVisible()">키 보기/숨기기</span>
    </div>
  </div>

  <!-- 안내 -->
  <div class="guide" style="margin-top:14px">
    <strong>💡 사용 방법</strong><br>
    1. API 키 입력 후 저장 (최초 1회만)<br>
    2. PMS에서 <b>객실현황(이달)</b> 화면 캡처<br>
    3. 위에 이미지 업로드<br>
    4. <b>문자 생성하기</b> 클릭 → 복사 후 이모님께 전송
  </div>

</div>

<script>
const DAYS = ["일","월","화","수","목","금","토"];
let b64 = null;
let mediaType = "image/jpeg";

window.onload = () => {
  const saved = localStorage.getItem("anthropic_key");
  if (saved) {
    document.getElementById("keyInput").value = saved;
    document.getElementById("keyInput").classList.add("saved");
    document.getElementById("saveBtn").textContent = "✅ 저장됨";
    document.getElementById("saveBtn").classList.add("saved");
    document.getElementById("keyStatus").style.display = "block";
    document.getElementById("keyDot").style.background = "#27ae60";
  } else {
    toggleKeyPanel();
  }
};

function toggleKeyPanel() {
  const panel = document.getElementById("keyPanel");
  const arrow = document.getElementById("keyArrow");
  if (panel.style.display === "none") {
    panel.style.display = "block";
    arrow.textContent = "▲ 접기";
  } else {
    panel.style.display = "none";
    arrow.textContent = "▼ 펼치기";
  }
}

function saveKey() {
  const key = document.getElementById("keyInput").value.trim();
  if (!key.startsWith("sk-ant-")) {
    alert("올바른 API 키를 입력해주세요. (sk-ant- 로 시작)");
    return;
  }
  localStorage.setItem("anthropic_key", key);
  document.getElementById("keyInput").classList.add("saved");
  document.getElementById("saveBtn").textContent = "✅ 저장됨";
  document.getElementById("saveBtn").classList.add("saved");
  document.getElementById("keyStatus").style.display = "block";
  document.getElementById("keyDot").style.background = "#27ae60";
  document.getElementById("keyPanel").style.display = "none";
  document.getElementById("keyArrow").textContent = "▼ 펼치기";
}

function toggleKeyVisible() {
  const input = document.getElementById("keyInput");
  input.type = input.type === "password" ? "text" : "password";
}

function handleDrop(e) {
  e.preventDefault();
  handleFile(e.dataTransfer.files[0]);
}

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const src = e.target.result;
    mediaType = file.type || "image/jpeg";
    b64 = src.split(",")[1];
    const preview = document.getElementById("preview");
    preview.src = src;
    preview.style.display = "block";
    document.getElementById("placeholder").style.display = "none";
    document.getElementById("dropZone").classList.add("has-image");
    document.getElementById("analyzeBtn").disabled = false;
    document.getElementById("resultCard").style.display = "none";
    document.getElementById("errorBox").style.display = "none";
  };
  reader.readAsDataURL(file);
}

async function analyze() {
  const apiKey = localStorage.getItem("anthropic_key") || document.getElementById("keyInput").value.trim();
  if (!apiKey) {
    alert("먼저 API 키를 입력하고 저장해주세요!");
    return;
  }
  if (!b64) return;

  document.getElementById("loading").style.display = "block";
  document.getElementById("analyzeBtn").disabled = true;
  document.getElementById("errorBox").style.display = "none";
  document.getElementById("resultCard").style.display = "none";

  const prompt = `당신은 숙박시설 PMS 화면을 분석하는 전문가입니다.

[객실 코드 변환]
Do-1U/Do-1D → D-1 / Do-2U/Do-2D → D-2 / Do-3U/Do-3D → D-3 / Do-4U/Do-4D → D-4
Ye-1U/Ye-1D → Y-1 / Ye-2U/Ye-2D → Y-2 / Ye-3U/Ye-3D → Y-3 / Ye-4U/Ye-4D → Y-4
Jun-1U/Jun-1D → J-1 / Jun-2U/Jun-2D → J-2 / Jun-3U/Jun-3D → J-3 / Jun-4U/Jun-4D → J-4

[날짜 파악 방법]
- 이미지 상단 날짜(예: 2026-05-26) = 오늘 = 하늘색으로 강조된 열
- 하늘색 열은 날짜 숫자가 표시되지 않지만 오늘 날짜
- 하늘색 열 바로 오른쪽부터 27, 28, 29... 순서로 날짜 진행
- 오늘 포함 총 7일치 분석 (예: 5/26, 5/27, 5/28, 5/29, 5/30, 5/31, 6/1)

[청소 판단 규칙]
각 객실의 각 날짜 열을 확인할 때, 해당 열의 왼쪽 칸 상태를 먼저 확인합니다.

★ 예외 조건 (최우선): 해당 열의 왼쪽(앞 칸)이 흰색(공실)이면 → 무조건 청소 아님

위 예외에 해당하지 않으면 아래 규칙 적용:
- 규칙①: 색깔이 다른 색으로 바뀌면 → 청소 (노랑→파랑, 파랑→노랑 등)
- 규칙①: 색깔이 흰색으로 끝나면 → 청소
- 규칙②: 같은 색이 이어지더라도 굵은 세로선이 있으면 → 청소

[예시 - 동일 이미지 기준]
5/26(하늘색 열):
- Do-2D 노란색 끝 → D-2 청소✅
- Ye-4D 노란색 끝 → Y-4 청소✅
- Jun-1U 노란색 끝 → J-1 청소✅
- Jun-4D 노란색 끝 → J-4 청소✅
결과: 5/26 4개 → D-2, Y-4, J-1, J-4

5/27(Wed 27 열):
- Do-4D 노란→파란 색변경 → D-4 청소✅
- Ye-1U 굵은 세로선 → Y-1 청소✅
결과: 5/27 2개 → D-4, Y-1

5/28(Thu 28 열):
- Do-2D 노란→파란 색변경 → D-2 청소✅
- Ye-3U 굵은 세로선 → Y-3 청소✅
- Jun-1U 굵은 세로선 → J-1 청소✅
결과: 5/28 3개 → D-2, Y-3, J-1

5/29(Fri 29 열):
- Do-1U 노란→파란 색변경+굵은선 → D-1 청소✅
- Ye-1U 굵은 세로선 → Y-1 청소✅
- Ye-2D 굵은 세로선 → Y-2 청소✅
- Jun-1U 굵은 세로선 → J-1 청소✅
- Jun-3U 굵은 세로선 → J-3 청소✅
결과: 5/29 5개 → D-1, Y-1, Y-2, J-1, J-3

[출력 형식] JSON만 반환 (마크다운 코드블록 없이)
{
  "baseDate": "이미지 상단 날짜 YYYY-MM-DD",
  "checkouts": [
    {"date": "MM-DD", "rooms": ["D-2", "Y-4", "J-1", "J-4"]}
  ]
}

- 오늘 포함 7일치 모든 날짜 포함, 청소 없는 날은 rooms:[]
- rooms 배열은 D → Y → J 순서, 같은 타입 내 숫자 오름차순 정렬`;

  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: b64 } },
            { type: "text", text: prompt }
          ]
        }]
      })
    });

    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);

    const text = data.content?.find(b => b.type === "text")?.text || "";
    const clean = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);

    const base = new Date(parsed.baseDate);
    let msg = "- 현관 비밀번호 : 0926*\n- 룸 비밀번호 : 092625*\n";

    parsed.checkouts.forEach(({date, rooms}) => {
      const [m, d] = date.split("-").map(Number);
      const dt = new Date(base.getFullYear(), m - 1, d);
      const day = DAYS[dt.getDay()];
      msg += "\n\n";
      if (!rooms || rooms.length === 0) {
        msg += `✔️${m}/${d}(${day})  휴무`;
      } else {
        // J, Y, D 순서로 각각 한 줄씩
        const order = ["D", "Y", "J"];
        const grouped = {};
        rooms.forEach(r => {
          const match = r.match(/^([A-Z]+)-(\d+)$/);
          if (match) {
            const [, prefix, num] = match;
            if (!grouped[prefix]) grouped[prefix] = [];
            grouped[prefix].push(Number(num));
          }
        });
        // 각 그룹 내 숫자 오름차순 정렬
        Object.keys(grouped).forEach(p => grouped[p].sort((a,b) => a-b));
        const lines = order
          .filter(p => grouped[p])
          .map(p => `${p}-${grouped[p].join(",")}`);
        msg += `✔️${m}/${d}(${day}) ${rooms.length}개\n${lines.join("\n")}`;
      }
    });

    document.getElementById("resultBox").textContent = msg.trim();
    document.getElementById("resultCard").style.display = "block";

  } catch(e) {
    document.getElementById("errorBox").textContent = "⚠️ 오류: " + e.message + "\n\nAPI 키를 확인하거나 더 선명한 이미지를 사용해주세요.";
    document.getElementById("errorBox").style.display = "block";
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("analyzeBtn").disabled = false;
}

function copyResult() {
  const txt = document.getElementById("resultBox").textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "✅ 복사됨!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "📋 복사"; btn.classList.remove("copied"); }, 2000);
  });
}
</script>
</body>
</html>
